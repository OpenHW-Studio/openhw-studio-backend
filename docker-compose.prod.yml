# Production Docker Compose for OpenHW Studio
services:
  mongodb:
    image: mongo:6.0
    container_name: openhw-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKER_USERNAME}/openhw-backend:${BACKEND_TAG:-develop}
    container_name: openhw-backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - PORT=5000
      - ROLE=main
      - MONGO_URI=mongodb://mongodb:27017/openhw-studio-production
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - GITHUB_ADMIN_TOKEN=${GITHUB_ADMIN_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER:-OpenHW-Studio}
      - FRONTEND_URL=${FRONTEND_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - VITE_ADMIN_EMAILS=${VITE_ADMIN_EMAILS}
      - EXAMPLES_DIR=/app/openhw-studio-examples/examples
      - ESP32_WORKER_HTTP_URL=http://esp32-worker:5001
      - ESP32_WORKER_WS_URL=ws://esp32-worker:5001
      - STM32_WORKER_HTTP_URL=http://stm32-worker:5002
      - STM32_WORKER_WS_URL=ws://stm32-worker:5002
    volumes:
      - ./persistent-data/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /app/temp:size=512M
      - /app/builds:size=256M
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/lib-list"]
      interval: 15s
      timeout: 5s
      retries: 5

  esp32-worker:
    image: ${DOCKER_USERNAME}/openhw-esp32-worker:${BACKEND_TAG:-develop}
    container_name: openhw-esp32-worker
    restart: on-failure
    environment:
      - PORT=5001
      - ROLE=esp32-worker
    volumes:
      - ./persistent-data/data:/app/data
    tmpfs:
      - /app/temp:size=1G
      - /app/builds:size=512M
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3.5G

  stm32-worker:
    image: ${DOCKER_USERNAME}/openhw-stm32-worker:${BACKEND_TAG:-develop}
    container_name: openhw-stm32-worker
    restart: on-failure
    environment:
      - PORT=5002
      - ROLE=stm32-worker
    volumes:
      - ./persistent-data/data:/app/data
    tmpfs:
      - /app/temp:size=1G
      - /app/builds:size=512M
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2.5G

  frontend:
    image: ${DOCKER_USERNAME}/openhw-frontend:${FRONTEND_TAG:-develop}
    container_name: openhw-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  health-agent:
    image: ${DOCKER_USERNAME}/openhw-health-agent:${HEALTH_AGENT_TAG:-develop}
    container_name: openhw-health-agent
    restart: always
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/proc:ro
      - /:/host_root:ro

volumes:
  mongodb_data:
