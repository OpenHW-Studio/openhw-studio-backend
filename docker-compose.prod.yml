# Production Docker Compose for OpenHW Studio
services:
  mongodb:
    image: mongo:6.0
    container_name: openhw-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKER_USERNAME}/openhw-backend:${BACKEND_TAG:-develop}
    container_name: openhw-backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/openhw-studio-production
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - GITHUB_ADMIN_TOKEN=${GITHUB_ADMIN_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER:-OpenHW-Studio}
      - FRONTEND_URL=${FRONTEND_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - VITE_ADMIN_EMAILS=${VITE_ADMIN_EMAILS}
      - EXAMPLES_DIR=/app/openhw-studio-examples/examples
    volumes:
      - backend-temp:/app/temp
      - backend-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/lib-list"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    image: ${DOCKER_USERNAME}/openhw-frontend:${FRONTEND_TAG:-develop}
    container_name: openhw-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
  backend-temp:
  backend-data:
