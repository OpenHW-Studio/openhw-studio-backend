name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test_and_build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4
        with:
          path: openhw-studio-backend

      - name: Checkout examples code
        uses: actions/checkout@v4
        with:
          repository: OpenHW-Studio/openhw-studio-examples
          path: openhw-studio-examples
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout emulator code
        uses: actions/checkout@v4
        with:
          repository: OpenHW-Studio/openhw-studio-emulator
          path: openhw-studio-emulator
          token: ${{ secrets.GITHUB_TOKEN }}

      # Add testing steps here if tests are added to the backend in the future.
      # - name: Run Backend Tests
      #   run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./openhw-studio-backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/openhw-backend:develop
            ${{ secrets.DOCKER_USERNAME }}/openhw-backend:${{ github.sha }}

  deploy:
    name: Deploy to Production
    needs: test_and_build
    runs-on: self-hosted
    environment:
      name: production # This environment requires manual approval in GitHub
      url: https://openhw-studio.fossee.in
    steps:
      - name: Pull and Restart Container Locally
        run: |
          cd /opt/openhw/backend
          
          # Pull latest orchestration files from GitHub
          git pull origin develop
          
          # Update the local .env file with the new backend tag for persistence
          sed -i '/^BACKEND_TAG=/d' .env || true
          echo "BACKEND_TAG=${{ github.sha }}" >> .env
          
          # Ensure Docker Hub credentials are available
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          
          # Log in to Docker Hub
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          docker compose -f docker-compose.prod.yml pull backend
          docker compose -f docker-compose.prod.yml up -d backend
          
          # Clean up old images to save disk space
          docker image prune -af
