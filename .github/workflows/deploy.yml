name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test_and_build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      agent_changed: ${{ steps.filter.outputs.agent }}
    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4
        with:
          path: openhw-studio-backend

      - name: Check for Health Agent changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          working-directory: openhw-studio-backend
          filters: |
            agent:
              - 'health-agent/**'

      - name: Checkout examples code
        uses: actions/checkout@v4
        with:
          repository: OpenHW-Studio/openhw-studio-examples
          path: openhw-studio-examples
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout emulator code
        uses: actions/checkout@v4
        with:
          repository: OpenHW-Studio/openhw-studio-emulator
          path: openhw-studio-emulator
          token: ${{ secrets.GITHUB_TOKEN }}

      # Add testing steps here if tests are added to the backend in the future.
      # - name: Run Backend Tests
      #   run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
            context: .
            file: ./openhw-studio-backend/Dockerfile
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/openhw-backend:develop
              ${{ secrets.DOCKER_USERNAME }}/openhw-backend:${{ github.sha }}

      - name: Build and push Health Agent
        if: steps.filter.outputs.agent == 'true'
        uses: docker/build-push-action@v5
        with:
            context: ./openhw-studio-backend/health-agent
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/openhw-health-agent:develop
              ${{ secrets.DOCKER_USERNAME }}/openhw-health-agent:${{ github.sha }}

  notify_admin:
    name: Notify Dashboard
    needs: test_and_build
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook to Backend
        run: |
          curl -X POST https://openhw-studio.fossee.in/api/deploy/notify \
          -H "Content-Type: application/json" \
          -d '{
            "repo": "${{ github.event.repository.name }}",
            "prTitle": "Build Successful: Deployment Waiting for Approval",
            "prDescription": "Commit: ${{ github.event.head_commit.message }}",
            "secret": "${{ secrets.NOTIFY_SECRET }}",
            "filesChanged": []
          }'

  notify_telegram:
    name: Notify Telegram
    needs: test_and_build
    runs-on: ubuntu-latest
    steps:
      - name: Send Message to Telegram
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "text": "🚀 <b>Build Successful: Waiting for Deployment Approval</b>\n\n📦 <b>Repo:</b> ${{ github.repository }}\n👤 <b>Author:</b> ${{ github.actor }}\n💬 <b>Message:</b> ${{ github.event.head_commit.message }}\n#️⃣ <b>Hash:</b> ${{ github.sha }}\n\n⚠️ <i>Please go to GitHub Actions to approve the deployment to production.</i>",
            "parse_mode": "HTML"
          }'

  deploy:
    name: Deploy to Production
    needs: test_and_build
    runs-on: self-hosted
    environment:
      name: production # This environment requires manual approval in GitHub
      url: https://openhw-studio.fossee.in
    steps:
      - name: Sync Infrastructure Files
        run: |
          cd /opt/openhw/backend
          git pull origin develop
          
      - name: Deploy Health Agent
        if: needs.test_and_build.outputs.agent_changed == 'true'
        run: |
          cd /opt/openhw/backend
          
          # Update tag in .env
          sed -i '/^HEALTH_AGENT_TAG=/d' .env || true
          echo "HEALTH_AGENT_TAG=${{ github.sha }}" >> .env
          
          # Ensure credentials
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          echo "Deploying Health Agent..."
          df -h
          docker image prune -af
          df -h
          docker compose -f docker-compose.prod.yml pull health-agent
          docker compose -f docker-compose.prod.yml up -d health-agent
          
          # Post-deployment cleanup
          # Post-deployment cleanup
          df -h
          docker image prune -af
          df -h

      - name: Deploy Backend
        run: |
          cd /opt/openhw/backend
          
          # Update tag in .env
          sed -i '/^BACKEND_TAG=/d' .env || true
          echo "BACKEND_TAG=${{ github.sha }}" >> .env
          
          # Ensure credentials
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          echo "Freeing space by removing old backend container..."
          docker compose -f docker-compose.prod.yml rm -fs backend
          df -h
          docker image prune -af
          df -h
          
          echo "Deploying Backend..."
          docker compose -f docker-compose.prod.yml pull backend
          docker compose -f docker-compose.prod.yml up -d backend
          
          # Final cleanup
          df -h
          docker image prune -af
          df -h

  agent_deployed:
    name: Notify Health Agent Updated
    needs: [test_and_build, deploy]
    if: success() && needs.test_and_build.outputs.agent_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Send Agent Success to Telegram
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "text": "🛡️ <b>Health Agent Updated</b>\n\n📦 <b>Version:</b> ${{ github.sha }}\n🚀 The health monitoring agent has been restarted.",
            "parse_mode": "HTML"
          }'

  backend_deployed:
    name: Notify Backend Updated
    needs: [test_and_build, deploy]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send Backend Success to Telegram
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "text": "✅ <b>Backend Deployment Successful</b>\n\n📦 <b>Repo:</b> ${{ github.repository }}\n🏷️ <b>Version:</b> ${{ github.sha }}\n👤 <b>Author:</b> ${{ github.actor }}\n\n🚀 The backend API has been updated and restarted.",
            "parse_mode": "HTML"
          }'
