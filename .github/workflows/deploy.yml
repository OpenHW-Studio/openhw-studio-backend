name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test_and_build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      agent_changed: ${{ steps.filter.outputs.agent }}
      esp32_changed: ${{ steps.filter.outputs.esp32 }}
      stm32_changed: ${{ steps.filter.outputs.stm32 }}
    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4
        with:
          path: openhw-studio-backend

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          working-directory: openhw-studio-backend
          filters: |
            agent:
              - 'health-agent/**'
            esp32:
              - 'src/esp32/**'
              - 'Dockerfile.esp32'
              - 'package.json'
              - 'src/utils/**'
            stm32:
              - 'src/stm32/**'
              - 'Dockerfile.stm32'
              - 'package.json'
              - 'src/utils/**'

      - name: Checkout examples code
        uses: actions/checkout@v4
        with:
          repository: OpenHW-Studio/openhw-studio-examples
          path: openhw-studio-examples
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout emulator code
        uses: actions/checkout@v4
        with:
          repository: OpenHW-Studio/openhw-studio-emulator
          path: openhw-studio-emulator
          token: ${{ secrets.GITHUB_TOKEN }}

      # Add testing steps here if tests are added to the backend in the future.
      # - name: Run Backend Tests
      #   run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Main Backend
        uses: docker/build-push-action@v5
        with:
            context: .
            file: ./openhw-studio-backend/Dockerfile.main
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/openhw-backend:develop
              ${{ secrets.DOCKER_USERNAME }}/openhw-backend:${{ github.sha }}
            cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/openhw-backend:buildcache
            cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/openhw-backend:buildcache,mode=max

      - name: Build and push ESP32 Worker
        if: steps.filter.outputs.esp32 == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
            context: .
            file: ./openhw-studio-backend/Dockerfile.esp32
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/openhw-esp32-worker:develop
              ${{ secrets.DOCKER_USERNAME }}/openhw-esp32-worker:${{ github.sha }}
            cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/openhw-esp32-worker:buildcache
            cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/openhw-esp32-worker:buildcache,mode=max

      - name: Build and push STM32 Worker
        if: steps.filter.outputs.stm32 == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
            context: .
            file: ./openhw-studio-backend/Dockerfile.stm32
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/openhw-stm32-worker:develop
              ${{ secrets.DOCKER_USERNAME }}/openhw-stm32-worker:${{ github.sha }}
            cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/openhw-stm32-worker:buildcache
            cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/openhw-stm32-worker:buildcache,mode=max

      - name: Build and push Health Agent
        if: steps.filter.outputs.agent == 'true'
        uses: docker/build-push-action@v5
        with:
            context: ./openhw-studio-backend/health-agent
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/openhw-health-agent:develop
              ${{ secrets.DOCKER_USERNAME }}/openhw-health-agent:${{ github.sha }}

  notify_admin:
    name: Notify Dashboard
    needs: test_and_build
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook to Backend
        run: |
          curl -X POST https://openhw-studio.fossee.in/api/deploy/notify \
          -H "Content-Type: application/json" \
          -d '{
            "repo": "${{ github.event.repository.name }}",
            "prTitle": "Build Successful: Deployment Waiting for Approval",
            "prDescription": "Commit: ${{ github.event.head_commit.message }}",
            "secret": "${{ secrets.NOTIFY_SECRET }}",
            "filesChanged": []
          }'

  notify_telegram:
    name: Notify Telegram
    needs: test_and_build
    runs-on: ubuntu-latest
    steps:
      - name: Send Message to Telegram
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "text": "🚀 <b>Build Successful: Waiting for Deployment Approval</b>\n\n📦 <b>Repo:</b> ${{ github.repository }}\n👤 <b>Author:</b> ${{ github.actor }}\n💬 <b>Message:</b> ${{ github.event.head_commit.message }}\n#️⃣ <b>Hash:</b> ${{ github.sha }}\n\n⚠️ <i>Please go to GitHub Actions to approve the deployment to production.</i>",
            "parse_mode": "HTML"
          }'

  deploy:
    name: Deploy to Production
    needs: test_and_build
    runs-on: self-hosted
    environment:
      name: production # This environment requires manual approval in GitHub
      url: https://openhw-studio.fossee.in
    steps:
      - name: Sync Infrastructure Files
        run: |
          cd /opt/openhw/backend
          git fetch origin develop
          git reset --hard origin/develop
          
      - name: Deploy Health Agent
        if: needs.test_and_build.outputs.agent_changed == 'true'
        run: |
          cd /opt/openhw/backend
          
          # Update tag in .env
          sed -i '/^HEALTH_AGENT_TAG=/d' .env || true
          echo "HEALTH_AGENT_TAG=${{ github.sha }}" >> .env
          
          # Ensure credentials
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          echo "Deploying Health Agent..."
          df -h
          docker image prune -af --filter "until=1h"
          df -h
          docker compose -f docker-compose.prod.yml pull health-agent
          docker compose -f docker-compose.prod.yml up -d health-agent
          
          sleep 10
          if [ -z "$(docker ps -q -f name=health-agent)" ]; then
            echo "Health Agent container crashed after startup!"
            exit 1
          fi
          
          # Post-deployment cleanup
          df -h
          docker image prune -af --filter "until=1h"
          df -h

      - name: Deploy Main Backend
        run: |
          cd /opt/openhw/backend
          
          # Update tag in .env
          sed -i '/^BACKEND_TAG=/d' .env || true
          echo "BACKEND_TAG=${{ github.sha }}" >> .env
          
          # Ensure credentials
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          echo "Current disk usage before pulling new backend image..."
          df -h
          
          echo "Pulling new backend image..."
          docker compose -f docker-compose.prod.yml pull backend
          
          echo "Upgrading running backend container..."
          docker compose -f docker-compose.prod.yml up -d backend
          
          sleep 10
          if [ -z "$(docker ps -q -f name=backend)" ]; then
            echo "Backend container crashed after startup!"
            exit 1
          fi
          
          echo "Cleaning up old dereferenced backend image..."
          df -h
          docker image prune -af --filter "until=1h"
          df -h

      - name: Deploy ESP32 Worker
        if: needs.test_and_build.outputs.esp32_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd /opt/openhw/backend
          
          # Update tag in .env
          sed -i '/^ESP32_WORKER_TAG=/d' .env || true
          echo "ESP32_WORKER_TAG=${{ github.sha }}" >> .env
          
          # Ensure credentials
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          echo "Current disk usage before pulling new ESP32 worker image..."
          df -h
          
          echo "Pulling new ESP32 worker image..."
          docker compose -f docker-compose.prod.yml pull esp32-worker
          
          echo "Upgrading running ESP32 worker container..."
          docker compose -f docker-compose.prod.yml up -d esp32-worker
          
          sleep 10
          if [ -z "$(docker ps -q -f name=esp32-worker)" ]; then
            echo "ESP32 worker container crashed after startup!"
            exit 1
          fi
          
          echo "Cleaning up old dereferenced ESP32 worker image..."
          df -h
          docker image prune -af --filter "until=1h"
          df -h

      - name: Deploy STM32 Worker
        if: needs.test_and_build.outputs.stm32_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd /opt/openhw/backend
          
          # Update tag in .env
          sed -i '/^STM32_WORKER_TAG=/d' .env || true
          echo "STM32_WORKER_TAG=${{ github.sha }}" >> .env
          
          # Ensure credentials
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          echo "Current disk usage before pulling new STM32 worker image..."
          df -h
          
          echo "Pulling new STM32 worker image..."
          docker compose -f docker-compose.prod.yml pull stm32-worker
          
          echo "Upgrading running STM32 worker container..."
          docker compose -f docker-compose.prod.yml up -d stm32-worker
          
          sleep 10
          if [ -z "$(docker ps -q -f name=stm32-worker)" ]; then
            echo "STM32 worker container crashed after startup!"
            exit 1
          fi
          
          echo "Cleaning up old dereferenced STM32 worker image..."
          df -h
          docker image prune -af --filter "until=1h"
          df -h

  agent_deployed:
    name: Notify Health Agent Updated
    needs: [test_and_build, deploy]
    if: success() && needs.test_and_build.outputs.agent_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Send Agent Success to Telegram
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "text": "🛡️ <b>Health Agent Updated</b>\n\n📦 <b>Version:</b> ${{ github.sha }}\n🚀 The health monitoring agent has been restarted.",
            "parse_mode": "HTML"
          }'

  backend_deployed:
    name: Notify Backend Updated
    needs: [test_and_build, deploy]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send Backend Success to Telegram
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "text": "✅ <b>Backend Deployment Successful</b>\n\n📦 <b>Repo:</b> ${{ github.repository }}\n🏷️ <b>Version:</b> ${{ github.sha }}\n👤 <b>Author:</b> ${{ github.actor }}\n\n🚀 The backend API has been updated and restarted.",
            "parse_mode": "HTML"
          }'
