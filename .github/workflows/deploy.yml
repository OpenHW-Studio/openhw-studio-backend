name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  test_and_build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Add testing steps here if tests are added to the backend in the future.
      # - name: Run Backend Tests
      #   run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/openhw-backend:develop

  deploy:
    name: Deploy to Production
    needs: test_and_build
    runs-on: ubuntu-latest
    environment:
      name: production # This environment requires manual approval in GitHub
      url: http://${{ secrets.SERVER_HOST }}
    steps:
      - name: Trigger Server Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /path/to/your/simulator # Replace with actual server path
            ./deploy.sh main
