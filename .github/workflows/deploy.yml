name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test_and_build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      agent_changed: ${{ steps.filter.outputs.agent }}
      compiler_changed: ${{ steps.filter.outputs.compiler }}
    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4
        with:
          path: openhw-studio-backend

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          working-directory: openhw-studio-backend
          filters: |
            agent:
              - 'health-agent/**'
            compiler:
              - 'src/compiler/**'
              - 'src/controllers/compileController.js'
              - 'src/routes/compile.js'
              - 'src/routes/api.js'
              - 'src/server.js'
              - 'src/services/dynamicLibraryManager.js'
              - 'src/services/libraryIndexService.js'
              - 'src/services/libraryTxtParser.js'
              - 'src/services/compileQueueManager.js'
              - 'src/services/compileCachePruner.js'
              - 'src/services/resourceManager.js'
              - 'src/config/libraries.json'
              - 'Dockerfile.compiler'
              - 'package.json'

      - name: Checkout examples code
        uses: actions/checkout@v4
        with:
          repository: OpenHW-Studio/openhw-studio-examples
          path: openhw-studio-examples
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout emulator code
        uses: actions/checkout@v4
        with:
          repository: OpenHW-Studio/openhw-studio-emulator
          path: openhw-studio-emulator
          token: ${{ secrets.GITHUB_TOKEN }}

      # Add testing steps here if tests are added to the backend in the future.
      # - name: Run Backend Tests
      #   run: npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Main Backend
        uses: docker/build-push-action@v5
        with:
            context: .
            file: ./openhw-studio-backend/Dockerfile.main
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/openhw-backend:develop
              ${{ secrets.DOCKER_USERNAME }}/openhw-backend:${{ github.sha }}
            cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/openhw-backend:buildcache
            cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/openhw-backend:buildcache,mode=max

      - name: Build and push Compiler Worker
        if: steps.filter.outputs.compiler == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
            context: .
            file: ./openhw-studio-backend/Dockerfile.compiler
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/openhw-compiler-worker:develop
              ${{ secrets.DOCKER_USERNAME }}/openhw-compiler-worker:${{ github.sha }}
            cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/openhw-compiler-worker:buildcache
            cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/openhw-compiler-worker:buildcache,mode=max

      - name: Build and push Health Agent
        if: steps.filter.outputs.agent == 'true'
        uses: docker/build-push-action@v5
        with:
            context: ./openhw-studio-backend/health-agent
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/openhw-health-agent:develop
              ${{ secrets.DOCKER_USERNAME }}/openhw-health-agent:${{ github.sha }}

      - name: Build and push Network Gateway
        uses: docker/build-push-action@v5
        with:
            context: ./openhw-studio-backend/openhw-local-gateway
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/openhw-network-gateway:develop
              ${{ secrets.DOCKER_USERNAME }}/openhw-network-gateway:${{ github.sha }}

  notify_admin:
    name: Notify Dashboard
    needs: test_and_build
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook to Backend
        run: |
          curl -X POST https://openhw-studio.fossee.in/api/deploy/notify \
          -H "Content-Type: application/json" \
          -d '{
            "repo": "${{ github.event.repository.name }}",
            "prTitle": "Build Successful: Deployment Waiting for Approval",
            "prDescription": "Commit: ${{ github.event.head_commit.message }}",
            "secret": "${{ secrets.NOTIFY_SECRET }}",
            "filesChanged": []
          }'

  notify_telegram:
    name: Notify Telegram
    needs: test_and_build
    runs-on: ubuntu-latest
    steps:
      - name: Send Message to Telegram
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "text": "🚀 <b>Build Successful: Waiting for Deployment Approval</b>\n\n📦 <b>Repo:</b> ${{ github.repository }}\n👤 <b>Author:</b> ${{ github.actor }}\n💬 <b>Message:</b> ${{ github.event.head_commit.message }}\n#️⃣ <b>Hash:</b> ${{ github.sha }}\n\n⚠️ <i>Please go to GitHub Actions to approve the deployment to production.</i>",
            "parse_mode": "HTML"
          }'

  deploy:
    name: Deploy to Production
    needs: test_and_build
    runs-on: self-hosted
    environment:
      name: production # This environment requires manual approval in GitHub
      url: https://openhw-studio.fossee.in
    steps:
      - name: Sync Infrastructure Files
        run: |
          cd /opt/openhw/backend
          git fetch origin develop
          git reset --hard origin/develop
          
      - name: Deploy Health Agent
        if: needs.test_and_build.outputs.agent_changed == 'true'
        run: |
          cd /opt/openhw/backend
          
          # Update tag in .env
          sed -i '/^HEALTH_AGENT_TAG=/d' .env || true
          echo "HEALTH_AGENT_TAG=${{ github.sha }}" >> .env
          
          # Ensure credentials
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          echo "Deploying Health Agent..."
          df -h
          docker image prune -af --filter "until=5m"
          df -h
          docker compose -f docker-compose.prod.yml pull health-agent
          docker compose -f docker-compose.prod.yml up -d health-agent
          
          sleep 10
          if [ -z "$(docker ps -q -f name=health-agent)" ]; then
            echo "Health Agent container crashed after startup!"
            exit 1
          fi
          
          # Post-deployment cleanup
          df -h
          docker image prune -af --filter "until=5m"
          df -h

      - name: Deploy Main Backend
        run: |
          cd /opt/openhw/backend
          
          # Update tag in .env
          sed -i '/^BACKEND_TAG=/d' .env || true
          echo "BACKEND_TAG=${{ github.sha }}" >> .env
          
          # Ensure credentials
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          echo "Current disk usage before pulling new backend image..."
          df -h
          
          echo "Pulling new backend image..."
          docker compose -f docker-compose.prod.yml pull backend
          
          echo "Upgrading running backend container..."
          docker compose -f docker-compose.prod.yml up -d backend
          
          sleep 10
          if [ -z "$(docker ps -q -f name=backend)" ]; then
            echo "Backend container crashed after startup!"
            exit 1
          fi
          
          echo "Cleaning up old dereferenced backend image..."
          df -h
          docker image prune -af --filter "until=5m"
          df -h

      - name: Deploy Compiler Worker
        if: needs.test_and_build.outputs.compiler_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd /opt/openhw/backend

          # Ensure credentials
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

          echo "Pulling new Compiler Worker image..."
          docker compose -f docker-compose.prod.yml pull compiler-worker

          echo "Upgrading running Compiler Worker container..."
          docker compose -f docker-compose.prod.yml up -d compiler-worker

          sleep 10
          if [ -z "$(docker ps -q -f name=compiler-worker)" ]; then
            echo "Compiler worker container crashed after startup!"
            exit 1
          fi

          docker image prune -af --filter "until=5m"

      - name: Deploy Network Gateway
        run: |
          cd /opt/openhw/backend
          
          # Ensure credentials
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          echo "Pulling new Network Gateway image..."
          docker compose -f docker-compose.prod.yml pull network-gateway
          
          echo "Upgrading running Network Gateway container..."
          docker compose -f docker-compose.prod.yml up -d network-gateway
          
          sleep 10
          if [ -z "$(docker ps -q -f name=network-gateway)" ]; then
            echo "Network Gateway container crashed after startup!"
            exit 1
          fi
          
          docker image prune -af --filter "until=5m"

  agent_deployed:
    name: Notify Health Agent Updated
    needs: [test_and_build, deploy]
    if: success() && needs.test_and_build.outputs.agent_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Send Agent Success to Telegram
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "text": "🛡️ <b>Health Agent Updated</b>\n\n📦 <b>Version:</b> ${{ github.sha }}\n🚀 The health monitoring agent has been restarted.",
            "parse_mode": "HTML"
          }'

  backend_deployed:
    name: Notify Backend Updated
    needs: [test_and_build, deploy]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send Backend Success to Telegram
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "text": "✅ <b>Backend Deployment Successful</b>\n\n📦 <b>Repo:</b> ${{ github.repository }}\n🏷️ <b>Version:</b> ${{ github.sha }}\n👤 <b>Author:</b> ${{ github.actor }}\n\n🚀 The backend API has been updated and restarted.",
            "parse_mode": "HTML"
          }'
