name: 🛡️ External Infrastructure Watchdog

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  check-uptime:
    name: Check Server Uptime
    runs-on: ubuntu-latest
    steps:
      - name: Get Previous Run Status
        id: prev_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the conclusion of the last completed run of this workflow
          PREV_CONCLUSION=$(gh run list --workflow external-watchdog.yml --limit 1 --status completed --json conclusion -q '.[0].conclusion' || echo "success")
          echo "previous_conclusion=$PREV_CONCLUSION" >> $GITHUB_OUTPUT
          echo "Previous run was: $PREV_CONCLUSION"

      - name: Check Frontend (Website)
        id: check_frontend
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://openhw-studio.fossee.in)
          if [ "$STATUS" -ne 200 ]; then
            echo "error_msg=🌍 Frontend (Website) is unreachable (HTTP $STATUS)" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Check Backend & Database
        id: check_backend
        if: always()
        run: |
          # Ping the real public status endpoint and parse JSON
          RESPONSE=$(curl -s https://openhw-studio.fossee.in/api/public/system-status)
          BACKEND_STATUS=$(echo $RESPONSE | jq -r '.status.backend' 2>/dev/null || echo "Error")
          DB_STATUS=$(echo $RESPONSE | jq -r '.status.database' 2>/dev/null || echo "Error")
          
          echo "Backend Status: $BACKEND_STATUS"
          echo "DB Status: $DB_STATUS"
          
          if [ "$BACKEND_STATUS" != "Operational" ] && [ "$BACKEND_STATUS" != "Maintenance" ]; then
             echo "error_msg=⚙️ Backend API is down or restricted ($BACKEND_STATUS)" >> $GITHUB_OUTPUT
             exit 1
          fi
          
          if [ "$DB_STATUS" != "Connected" ]; then
             echo "error_msg=🗄️ MongoDB Database is disconnected!" >> $GITHUB_OUTPUT
             exit 1
          fi

      - name: Notify Telegram on Failure
        if: failure()
        run: |
          ERR_FE="${{ steps.check_frontend.outputs.error_msg }}"
          ERR_BE="${{ steps.check_backend.outputs.error_msg }}"
          
          # Combine errors
          ERROR_DETAILS="${ERR_FE:-}${ERR_FE:+$'\n'}${ERR_BE:-}"
          
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -H "Content-Type: application/json" \
          -d "{
            \"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\",
            \"text\": \"🆘 <b>INFRASTRUCTURE ALERT</b>\n\n⚠️ <b>Issues detected:</b>\n${ERROR_DETAILS:-Total server timeout}\n\n🛡️ <b>Guardian:</b> External Watchdog\n\n🚨 <i>Please check the VM status immediately.</i>\",
            \"parse_mode\": \"HTML\"
          }"

      - name: Notify Telegram on Recovery
        if: success() && steps.prev_status.outputs.previous_conclusion == 'failure'
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "${{ secrets.TELEGRAM_CHAT_ID }}",
            "text": "✅ <b>SERVICES RECOVERED</b>\n\n🚀 <b>Status:</b> All systems are back online and Operational.\n\n🌍 <b>Target:</b> https://openhw-studio.fossee.in\n🛡️ <b>Guardian:</b> External Watchdog\n\n✨ <i>Infrastructure is stable again.</i>",
            "parse_mode": "HTML"
          }'
